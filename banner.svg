  <!-- Ventana de editor -->
  <g transform="translate(1110 80)">
    <rect width="420" height="250" rx="12" fill="#1a1b26" stroke="#3b4261" stroke-width="1.5"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v22 h-420 Z" fill="#24283b"/>
    <circle cx="20" cy="17" r="6" fill="#f7768e"/>
    <circle cx="40" cy="17" r="6" fill="#e0af68"/>
