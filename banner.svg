      <stop offset="1" stop-color="#ff9e64" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3b4261"/>
    </pattern>
  </defs>

  <!-- Fondo -->
