    <g font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="16">
      <text x="20" y="66"><tspan fill="#bb9af7">class</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#2ac3de">Alejandro</tspan><tspan fill="#c0caf5"> {</tspan></text>
      <text x="40" y="94"><tspan fill="#bb9af7">public</tspan><tspan fill="#c0caf5"> $city = </tspan><tspan fill="#9ece6a">'Granada'</tspan><tspan fill="#c0caf5">;</tspan></text>
